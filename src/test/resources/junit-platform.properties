# ============================================================
# Configuração do Cucumber dentro do JUnit Platform
# (o JUnit lê este arquivo sozinho, pela raiz do classpath)
# ============================================================

# Pacotes onde o Cucumber procura os Hooks e os Steps
cucumber.glue=com.test.automation.hooks,com.test.automation.steps

# "pretty" mostra cada passo no console; "html" gera o relatório do Cucumber
cucumber.plugin=pretty, html:reports/cucumber-report.html

# Console sem códigos de cor (o antigo monochrome = true)
cucumber.ansi-colors.disabled=true

# Nome dos testes no Surefire/Jenkins: só o nome do cenário (os IDs já dizem a área)
cucumber.junit-platform.naming-strategy=short
# Nos Esquemas do Cenário, usa o nome real ("CT01 - ...") em vez de "Example #1.1"
cucumber.junit-platform.naming-strategy.short.example-name=pickle

# ATENÇÃO: o filtro de tags NÃO fica aqui.
# Use as tags do JUnit pela linha de comando: mvn test "-Dgroups=login"
# (cucumber.filter.tags só pula os cenários, e eles contam como "skipped")